<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLG Bombas y Piletas - Categorías</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding-bottom: 60px; }
        header { 
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e3a8a 100%);
            padding: 30px 25px; display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 3px solid #3b82f6; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-img { max-height: 60px; width: auto; }
        .back-btn { 
            background: rgba(59, 130, 246, 0.15); color: #93c5fd; padding: 10px 20px; border-radius: 8px; 
            text-decoration: none; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            border: 1px solid rgba(59, 130, 246, 0.3); transition: all 0.2s;
        }
        .back-btn:hover { background: #3b82f6; color: white; border-color: #3b82f6; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 25px; }
        
        /* Buscador Principal */
        .search-container { margin-bottom: 40px; }
        .search-form { display: flex; gap: 12px; max-width: 600px; margin: 0 auto; }
        .search-input { 
            flex-grow: 1; padding: 15px 20px; font-size: 15px; border-radius: 12px; border: 1px solid rgba(59, 130, 246, 0.3);
            background: rgba(30, 41, 59, 0.8); color: white; outline: none; font-family: 'Outfit', sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.2s;
        }
        .search-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3); }
        .search-btn { 
            background: #2563eb; color: white; border: none; padding: 0 25px; border-radius: 12px; 
            font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 13px; transition: background 0.2s;
        }
        .search-btn:hover { background: #1d4ed8; }

        .section-title { font-size: 24px; font-weight: 700; color: #f8fafc; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 12px; }
        .section-title::after { content: ""; flex-grow: 1; height: 2px; background: linear-gradient(90deg, #3b82f6, transparent); }

        .categories-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .category-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border-radius: 16px; padding: 30px 25px; text-decoration: none; color: white;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(59, 130, 246, 0.2);
            display: flex; justify-content: space-between; align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .category-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #3b82f6; transition: width 0.3s; }
        .category-card:hover { transform: translateY(-6px); border-color: #60a5fa; box-shadow: 0 20px 35px -10px rgba(59, 130, 246, 0.3); }
        .category-card:hover::before { width: 8px; background: #60a5fa; }
        .cat-title { font-size: 18px; font-weight: 600; margin: 0; color: #f8fafc; letter-spacing: 0.5px; }
        .arrow { background: rgba(59, 130, 246, 0.15); color: #60a5fa; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: all 0.3s; }
        .category-card:hover .arrow { background: #3b82f6; color: white; transform: translateX(4px); }
    </style>
</head>
<body>
    <header>
        <img src="{{ logo_url }}" alt="BLG Bombas y Piletas" class="logo-img">
        <a href="/" class="back-btn">&larr; Volver a Portada</a>
    </header>
    
    <div class="container">
        <!-- Barra Buscador -->
        <div class="search-container">
            <form action="/buscar" method="GET" class="search-form">
                <input type="text" name="q" class="search-input" placeholder="🔍 Buscar por nombre de producto o SKU..." required>
                <button type="submit" class="search-btn">Buscar</button>
            </form>
        </div>

        <h2 class="section-title">Categorías Disponibles</h2>
        <div class="categories-grid">
            {% for cat in categorias %}
            <a href="/categoria/{{ cat[0] }}" class="category-card">
                <span class="cat-title">{{ cat[1] }}</span>
                <span class="arrow">&rarr;</span>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
